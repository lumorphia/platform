name: ci

# 検査は PR でだけ回す。develop / main への push (= マージ) では、PR で確かめた中身を回し直さない。
# public リポジトリなので Actions の時間は org の上限を使わない (docs/adr/0002)。
# main への push (= リリース PR のマージ) では release-please と公開 (release ジョブ) だけを回す
on:
  pull_request:
  push:
    branches: [main]

# 同じ PR への連続 push で古い run を取り消す
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # storage の結合テスト (S3 互換) の相手。lumorphia/prismtone のローカル S3 と同じ RustFS (prismtone ADR-0026)
    services:
      rustfs:
        image: rustfs/rustfs:1.0.0
        env:
          RUSTFS_ACCESS_KEY: platform
          RUSTFS_SECRET_KEY: platform-test-secret
        ports:
          - 9000:9000
    env:
      S3_TEST_ENDPOINT: http://127.0.0.1:9000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      # CI=true なので、S3_TEST_ENDPOINT が無いと storage の結合テストは skip ではなく失敗する
      - run: pnpm test:coverage
      - run: pnpm build:packages

  # シークレットの混入と高リスクの脆弱性 (ほかのリポジトリと同じ再利用ワークフロー、ADR-0009)
  security:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/security.yml

  # main への push で release-please と、版が上がったパッケージの公開 (再利用ワークフロー、ADR-0009)
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
      packages: write
    uses: ./.github/workflows/release.yml
    secrets: inherit
